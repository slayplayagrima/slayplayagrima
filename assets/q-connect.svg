    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.62  0 0 0 0 1  0 0 0 2.4 -1.3"/>
  </filter>
  <radialGradient id="vign" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <linearGradient id="band" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="planet" cx="32%" cy="30%" r="80%"><stop offset="0" stop-color="#8FD0FF"/><stop offset=".35" stop-color="#2F78C9"/><stop offset=".7" stop-color="#0C2C63"/><stop offset="1" stop-color="#020814"/></radialGradient>
  <radialGradient id="shade" cx="85%" cy="85%" r="95%"><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
