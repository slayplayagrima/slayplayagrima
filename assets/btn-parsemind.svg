<svg xmlns="http://www.w3.org/2000/svg" width="160" height="52" viewBox="0 0 160 52">
<defs>
  <filter id="nebula" x="-1200" y="-1200" width="3600" height="3600" filterUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="5" seed="8"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.27  0 0 0 0 0.72  0 0 0 2.1 -1.0"/>
  </filter>
  <filter id="nebula2" x="-1200" y="-1200" width="3600" height="3600" filterUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="21"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.62  0 0 0 0 1  0 0 0 2.4 -1.3"/>
  </filter>
  <radialGradient id="vign" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  <linearGradient id="band" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="planet" cx="32%" cy="30%" r="80%"><stop offset="0" stop-color="#8FD0FF"/><stop offset=".35" stop-color="#2F78C9"/><stop offset=".7" stop-color="#0C2C63"/><stop offset="1" stop-color="#020814"/></radialGradient>
  <radialGradient id="shade" cx="85%" cy="85%" r="95%"><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
  <radialGradient id="atmo"><stop offset=".86" stop-color="#7EC8FF" stop-opacity="0"/><stop offset=".93" stop-color="#7EC8FF" stop-opacity=".55"/><stop offset="1" stop-color="#7EC8FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#FFF8E7"/><stop offset=".15" stop-color="#FFE9C2" stop-opacity=".9"/><stop offset=".45" stop-color="#8DB8FF" stop-opacity=".35"/><stop offset="1" stop-color="#2B4C9B" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>
<style>
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
  .spin{animation:spin 60s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .spinslow{animation:spin 120s linear infinite}
  .shoot{animation:shoot 9s ease-in infinite}
  @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}10%{transform:translate(-380px,190px);opacity:0}100%{opacity:0}}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .breathe{animation:br 6s ease-in-out infinite}
  @keyframes br{0%,100%{opacity:.6}50%{opacity:1}}
</style><clipPath id="bc"><rect x="2" y="2" width="156" height="48" rx="13"/></clipPath><g clip-path="url(#bc)"><rect width="160" height="52" fill="#02040B"/>
