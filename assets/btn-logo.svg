  <radialGradient id="core"><stop offset="0" stop-color="#FFF8E7"/><stop offset=".15" stop-color="#FFE9C2" stop-opacity=".9"/><stop offset=".45" stop-color="#8DB8FF" stop-opacity=".35"/><stop offset="1" stop-color="#2B4C9B" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>
<style>
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
  .spin{animation:spin 60s linear infinite}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .spinslow{animation:spin 120s linear infinite}
  .shoot{animation:shoot 9s ease-in infinite}
  @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}10%{transform:translate(-380px,190px);opacity:0}100%{opacity:0}}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .breathe{animation:br 6s ease-in-out infinite}
  @keyframes br{0%,100%{opacity:.6}50%{opacity:1}}
</style><clipPath id="bc"><rect x="2" y="2" width="116" height="48" rx="13"/></clipPath><g clip-path="url(#bc)"><rect width="120" height="52" fill="#02040B"/>
