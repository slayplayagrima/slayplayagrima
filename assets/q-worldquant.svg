<defs>
  <filter id="nebula" x="-1200" y="-1200" width="3600" height="3600" filterUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="5" seed="8"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.27  0 0 0 0 0.72  0 0 0 2.1 -1.0"/>
  </filter>
  <filter id="nebula2" x="-1200" y="-1200" width="3600" height="3600" filterUnits="userSpaceOnUse">
